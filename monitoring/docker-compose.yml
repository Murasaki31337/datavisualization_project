version: "3.9"

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom_data:/prometheus

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana

  node_exporter:
    image: prom/node-exporter:latest
    container_name: node_exporter
    restart: unless-stopped
    ports:
      - "9100:9100"

  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgres_exporter
    restart: unless-stopped
    ports:
      - "9187:9187"
    environment:
      DATA_SOURCE_URI: host.docker.internal:5432/valorant_tournament?sslmode=disable
      DATA_SOURCE_USER: mon_user
      DATA_SOURCE_PASS: mon_pass

      # Tell exporter where custom queries are located
      PG_EXPORTER_EXTEND_QUERY_PATH: /etc/postgres_exporter/queries.yml

      # Optional — keep default Postgres metrics too
      PG_EXPORTER_DISABLE_DEFAULT_METRICS: "false"
      PG_EXPORTER_DISABLE_SETTINGS_METRICS: "false"

    command:
      - '--extend.query-path=/etc/postgres_exporter/queries.yml'

    volumes:
      - ./queries.yml:/etc/postgres_exporter/queries.yml:ro


  custom_exporter:
    build: ./custom_exporter   # folder that contains your custom_exporter.py and Dockerfile
    container_name: custom_exporter
    restart: unless-stopped
    ports:
      - "8000:8000"
    networks:
      - monitor-net

networks:
  monitor-net:
    driver: bridge

volumes:
  prom_data:
  grafana_data:
