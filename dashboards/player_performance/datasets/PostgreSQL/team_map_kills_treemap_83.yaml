schema: public
sql: "SELECT\r\n    d.player_team,\r\n    m.map_name,\r\n    SUM(d.k) AS total_kills\r\
  \nFROM detailed_matches_player_stats d\r\nJOIN detailed_matches_maps m\r\n  ON d.match_id\
  \ = m.match_id\r\nWHERE d.k IS NOT NULL\r\nGROUP BY d.player_team, m.map_name\r\n\
  ORDER BY total_kills DESC\r\nLIMIT 50;\r\n"
