schema: public
sql: "SELECT \r\n    m.map_name AS map_label,\r\n    ROUND(AVG(d.adr)::numeric, 1)\
  \ AS avg_adr\r\nFROM detailed_matches_player_stats d\r\nJOIN detailed_matches_maps\
  \ m ON d.match_id = m.match_id\r\nGROUP BY m.map_name\r\nORDER BY avg_adr DESC;\r\
  \n"
