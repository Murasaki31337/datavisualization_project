sql: "SELECT\r\n    agent_name,\r\n    key AS map_name,\r\n    value::numeric AS utilization,\r\
  \n    ROUND( ((value::numeric / NULLIF(total_utilization, 0)) * 100)::numeric, 2\
  \ ) AS percent_of_total\r\nFROM agents_stats,\r\n     jsonb_each_text(map_utilizations)\r\
  \nWHERE value::numeric > 0\r\nORDER BY map_name, percent_of_total DESC;\r\n"
