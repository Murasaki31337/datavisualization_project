catalog: valorant_tournament
schema: public
sql: "SELECT\r\n    map_name,\r\n    times_played,\r\n    attack_win_percent,\r\n\
  \    defense_win_percent,\r\n\r\n    -- \u2705 Normalized attack win % (Task 13,\
  \ fixed)\r\n    ROUND(\r\n        ((attack_win_percent - MIN(attack_win_percent)\
  \ OVER ()) \r\n         / NULLIF(MAX(attack_win_percent) OVER () - MIN(attack_win_percent)\
  \ OVER (), 0))::numeric,\r\n    3) AS attack_win_norm,\r\n\r\n    -- \u2705 Categorization\
  \ (Task 14)\r\n    CASE\r\n        WHEN attack_win_percent < 0.49 THEN 'Low'\r\n\
  \        WHEN attack_win_percent BETWEEN 0.49 AND 0.52 THEN 'Medium'\r\n       \
  \ WHEN attack_win_percent > 0.52 THEN 'High'\r\n        ELSE 'Unknown'\r\n    END\
  \ AS attack_win_category\r\n\r\nFROM maps_stats\r\nWHERE attack_win_percent IS NOT\
  \ NULL\r\nORDER BY attack_win_percent DESC;\r\n"
