sql: "SELECT\r\n    mg.map_name,\r\n    mg.country,\r\n    mg.latitude,\r\n    mg.longitude,\r\
  \n    ms.times_played,\r\n    ROUND(((ms.attack_win_percent + ms.defense_win_percent)\
  \ / 2)::numeric, 2) AS average_win_rate\r\nFROM map_geo mg\r\nJOIN maps_stats ms\r\
  \n  ON mg.map_name = ms.map_name\r\nORDER BY ms.times_played DESC;\r\n"
